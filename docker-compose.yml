services:
  postgres:
    image: postgres:18
    container_name: unicycle-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: unicycle
      POSTGRES_USER: unicycle
      POSTGRES_PASSWORD: development

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
